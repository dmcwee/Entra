name: Update Pages Branch

run-name: Update Pages Branch

on:
    push:
        branches:
            - master

permissions:
    contents: write

concurrency:
    group: update-pages-branch-${{ github.ref }}
    cancel-in-progress: true

jobs:
    update-pages-branch:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout master branch
              uses: actions/checkout@v5
              with:
                ref: master

            - name: list current directory
              run: |
                echo "Current branch: ${{ github.ref }}"
                echo "Current directory: $(pwd)"
                echo "Listing files:"
                ls -la

                mkdir -p ../gh-pages

                cp *.html ../gh-pages/
                
                for dir in */ ; do
                    if [[ -d "$dir" ]]; then
                        echo "Copying directory: $dir"
                        cp -r "$dir" ../gh-pages/
                    fi
                done
    
            - name: Checkout ghpages branch
              uses: actions/checkout@v5
              with:
                ref: gh-pages

            - name: list gh-pages directory
              run: |
                cp ../gh-pages/* . -r
                ls -la

            - name: Commit and push changes
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add .
                git commit -m "Update gh-pages branch" || echo "No changes to commit"
                git push origin gh-pages